<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront - rnxJS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="demo.css">
</head>

<body>

    <div class="topbar">
        <div class="shell topbar-in mono">
            <a class="wordmark" href="./" style="color:inherit;text-decoration:none">rnxJS</a>
            <span class="sep">/</span>
            <span>storefront</span>
            <span class="spacer"></span>
            <span class="chan" data-ref="cart"><i class="bi bi-bag"></i>&nbsp;<span data-ref="cartCount">0</span></span>
            <a class="chan" href="./"><i class="bi bi-arrow-left"></i>&nbsp;All demos</a>
        </div>
    </div>

    <div class="shell">

        <header class="page-head">
            <div class="titles">
                <h1>Parts catalogue</h1>
                <p class="sub">
                    Filtering and cart state held in one reactive object. The grid
                    re-renders from it, nothing else.
                </p>
            </div>
            <div class="page-actions" data-ref="actions"></div>
        </header>

        <section class="panel">
            <div class="panel-body">
                <div class="form-grid" data-ref="filters"></div>
            </div>
        </section>

        <section class="grid-cards" style="margin-top:0.85rem" data-ref="grid"></section>

        <p class="hint mono" style="margin:1rem 0 0;color:var(--faint);font-size:0.78rem" data-ref="count"></p>

    </div>

    <footer style="margin-top:2.5rem">
        <div class="shell" style="display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center;">
            <span class="mono" data-ref="footVersion">rnxJS</span>
            <a href="./">All demos</a>
            <a href="https://github.com/BaryoDev/rnxJS_samples">Source</a>
            <span style="margin-left:auto" class="mono">MPL-2.0</span>
        </div>
    </footer>

    <script src="./rnx.global.js"></script>
    <script>
        const { Select, Input, Button, createReactiveState } = rnx;
        const $ = (ref) => document.querySelector(`[data-ref="${ref}"]`);

        const PRODUCTS = [
            { sku: 'BRK-2210', name: 'Ceramic brake pad set', cat: 'braking', price: 84, stock: 42 },
            { sku: 'BRK-2255', name: 'Vented brake disc, 320mm', cat: 'braking', price: 156, stock: 8 },
            { sku: 'FLT-0480', name: 'Cabin particulate filter', cat: 'filtration', price: 22, stock: 190 },
            { sku: 'FLT-0512', name: 'Oil filter, long service', cat: 'filtration', price: 17, stock: 0 },
            { sku: 'SUS-1130', name: 'Front coil spring, heavy', cat: 'suspension', price: 128, stock: 21 },
            { sku: 'SUS-1194', name: 'Damper, gas, rear pair', cat: 'suspension', price: 240, stock: 6 },
            { sku: 'ELE-3301', name: 'Alternator, 140A', cat: 'electrical', price: 315, stock: 3 },
            { sku: 'ELE-3355', name: 'Glow plug set of four', cat: 'electrical', price: 48, stock: 77 },
        ];

        const state = createReactiveState({ cat: 'all', sort: 'name', query: '', cart: 0 });

        // ---- filters --------------------------------------------------------

        const field = (label, control) => {
            const w = document.createElement('div');
            w.className = 'field';
            const l = document.createElement('label');
            l.textContent = label;
            w.append(l, control);
            return w;
        };

        const catSelect = Select({
            value: 'all',
            options: [
                { value: 'all', label: 'All categories' },
                { value: 'braking', label: 'Braking' },
                { value: 'filtration', label: 'Filtration' },
                { value: 'suspension', label: 'Suspension' },
                { value: 'electrical', label: 'Electrical' },
            ],
        });

        const sortSelect = Select({
            value: 'name',
            options: [
                { value: 'name', label: 'Name' },
                { value: 'price-low', label: 'Price, low to high' },
                { value: 'price-high', label: 'Price, high to low' },
                { value: 'stock', label: 'Stock on hand' },
            ],
        });

        const search = Input({ placeholder: 'Search name or SKU' });

        $('filters').append(
            field('Search', search),
            field('Category', catSelect),
            field('Sort by', sortSelect),
        );

        const control = (wrapper) => wrapper.querySelector('select, input') || wrapper;
        control(catSelect).addEventListener('change', (e) => { state.cat = e.target.value; render(); });
        control(sortSelect).addEventListener('change', (e) => { state.sort = e.target.value; render(); });
        control(search).addEventListener('input', (e) => { state.query = e.target.value.toLowerCase(); render(); });

        // ---- grid -----------------------------------------------------------

        function visible() {
            let out = PRODUCTS.filter(p =>
                (state.cat === 'all' || p.cat === state.cat) &&
                (!state.query || (p.name + ' ' + p.sku).toLowerCase().includes(state.query)));
            if (state.sort === 'price-low') out.sort((a, b) => a.price - b.price);
            else if (state.sort === 'price-high') out.sort((a, b) => b.price - a.price);
            else if (state.sort === 'stock') out.sort((a, b) => b.stock - a.stock);
            else out.sort((a, b) => a.name.localeCompare(b.name));
            return out;
        }

        function render() {
            const items = visible();
            $('count').textContent = `${items.length} of ${PRODUCTS.length} parts`;
            $('grid').innerHTML = items.map(p => `
                <article class="part">
                    <div class="part-head">
                        <span class="mono part-sku">${p.sku}</span>
                        ${p.stock === 0
                            ? '<span class="tag off">Out of stock</span>'
                            : p.stock < 10 ? `<span class="tag">${p.stock} left</span>` : ''}
                    </div>
                    <h3>${p.name}</h3>
                    <div class="part-foot">
                        <span class="part-price">€${p.price}</span>
                        <a class="part-add ${p.stock === 0 ? 'is-off' : ''}"
                           role="button" tabindex="0" data-sku="${p.sku}">
                           ${p.stock === 0 ? 'Notify me' : 'Add'}
                        </a>
                    </div>
                </article>
            `).join('');
        }

        $('grid').addEventListener('click', (e) => {
            const a = e.target.closest('.part-add');
            if (!a || a.classList.contains('is-off')) return;
            state.cart += 1;
            $('cartCount').textContent = state.cart;
        });

        $('actions').append(Button({ label: 'Request a quote', icon: 'file-earmark-text', variant: 'outlined' }));

        render();

        const build = (document.documentElement.dataset.rnxVersion || '').trim();
        if (build) $('footVersion').textContent = 'rnxJS ' + build;
    </script>
</body>

</html>

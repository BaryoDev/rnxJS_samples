server {
    listen 80;
    server_name playground.baryo.dev 140.245.103.105 localhost;

    # Serve rnxJS samples at /rnxjs path
    location /rnxjs {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Redirect root to /rnxjs
    location = / {
        return 301 /rnxjs/;
    }
}

server {
    listen 80;
    server_name localhost;

    # Serve rnxJS samples at /rnxjs path
    location /rnxjs {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Redirect root to /rnxjs
    location = / {
        return 301 /rnxjs/;
    }
}

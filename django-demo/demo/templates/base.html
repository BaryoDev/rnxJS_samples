{% load rnx %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}rnxJS + Django Demo{% endblock %}</title>

    {% rnx_scripts cdn=True theme='bootstrap' %}

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="glass mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0 fw-bold">
                    <i class="bi bi-lightning-charge-fill text-primary"></i> rnxJS + Django
                </h1>
                <div class="d-flex gap-2">
                    <a href="{% url 'index' %}" class="btn btn-outline-primary">Home</a>
                    <a href="{% url 'contact' %}" class="btn btn-outline-primary">Contact</a>
                    <a href="{% url 'profile' %}" class="btn btn-outline-primary">Profile</a>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <div class="glass">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% rnx_plugin 'toast' position='top-right' %}
</body>

</html>

{% extends "base.html" %}
{% load rnx %}

{% block title %}Profile - rnxJS + Django{% endblock %}

{% block content %}
{% rnx_state user_data 'user' %}

<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <div class="mb-3">
                    <i class="bi bi-person-circle display-1 text-primary"></i>
                </div>
                <h3 class="h5 fw-bold" data-bind="user.name"></h3>
                <p class="text-muted" data-bind="user.role"></p>
                <p class="small">
                    <i class="bi bi-envelope-fill"></i> <span data-bind="user.email"></span>
                </p>
                <p class="small">
                    <i class="bi bi-geo-alt-fill"></i> <span data-bind="user.location"></span>
                </p>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card mb-3">
            <div class="card-body">
                <h3 class="h5 fw-bold mb-3">About</h3>
                <p data-bind="user.bio"></p>
                <p class="small text-muted">
                    <i class="bi bi-calendar-fill"></i> Joined: <span data-bind="user.joined"></span>
                </p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h3 class="h5 fw-bold mb-3">Projects</h3>
                <div id="projects-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Render projects dynamically
    const projectsList = document.getElementById('projects-list');
    projectsList.innerHTML = window.user.projects.map(project => `
            <div class="mb-3 pb-3 border-bottom">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong>${project.name}</strong>
                    <span class="badge ${project.status === 'Active' ? 'bg-success' : project.status === 'Completed' ? 'bg-primary' : 'bg-secondary'}">
                        ${project.status}
                    </span>
                </div>
                <div class="progress" style="height: 8px;">
                    <div class="progress-bar" role="progressbar" style="width: ${project.progress}%"></div>
                </div>
                <small class="text-muted">${project.progress}% complete</small>
            </div>
        `).join('');
</script>
{% endblock %}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # rnxjs main moves independently of this repo, so check daily that the
    # next channel would still build and pass.
    - cron: '0 6 * * *'

permissions:
  contents: read

# Superseded runs are cancelled everywhere except main, so a newer push cannot
# kill a run that is releasing. The deploy job also has its own group below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out rnxjs
        uses: actions/checkout@v4
        with:
          repository: BaryoDev/rnxjs
          path: .rnxjs
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The next channel exists to show what main does. Publishing a build from
      # a red main would make it show something nobody has verified, so the
      # library's own suite is the gate.
      - name: rnxjs suite must be green
        working-directory: .rnxjs
        run: |
          npm ci
          npm test

      - name: Build both channels
        env:
          RNXJS_REPO: ${{ github.workspace }}/.rnxjs
        run: ./build-deploy.sh

      - name: Install browser
        run: npx playwright install chromium --with-deps

      - name: Smoke test both channels
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: playground-dist
          path: dist/
          retention-days: 7

  # Deploying needs an SSH key for the VM. Add DEPLOY_KEY as a repository secret
  # to turn this on; until then CI proves the build is good and the release is
  # run locally with `npm run deploy`.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A release must finish once it starts, so a second deploy waits.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Is a deploy key configured?
        id: gate
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Skip, no deploy key
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "No DEPLOY_KEY secret, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "The verified build is attached to this run as playground-dist." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy locally with: npm run build && npm run deploy" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: playground-dist
          path: dist

      # Pinned and checksum-verified, instead of building @latest from source
      # while the deploy key is on the runner.
      - name: Install BaryoVM
        if: steps.gate.outputs.ready == 'true'
        uses: BaryoDev/setup-baryovm@532d0a4241d68600c25ead4938e8f3abebea1a56 # main, no release tag yet
        with:
          version: 0.6.0

      - name: Release through BaryoVM
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          # Refuse a host that is not in known_hosts instead of learning its key.
          BARYOVM_STRICT_HOST_KEYS: "1"
        run: |
          set -euo pipefail
          # The host key comes from a repository variable, never from
          # ssh-keyscan at run time. Create it once from a trusted machine:
          #   ssh-keyscan -H 140.245.103.105
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "DEPLOY_KNOWN_HOSTS variable is not set, refusing to deploy." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/oracle_vm_key
          chmod 600 ~/.ssh/oracle_vm_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F 140.245.103.105 -f ~/.ssh/known_hosts >/dev/null; then
            echo "DEPLOY_KNOWN_HOSTS has no key for 140.245.103.105, refusing to deploy." >&2
            exit 1
          fi

          # setup-baryovm sets BARYOVM_HOME, and baryovm reads the fleet from there.
          fleet_dir="${BARYOVM_HOME:-$HOME/.baryovm}"
          mkdir -p "$fleet_dir"
          cat > "$fleet_dir/fleet.json" <<'JSON'
          {"vms":[{"name":"oracle","host":"140.245.103.105","user":"opc","key":"~/.ssh/oracle_vm_key"}],
           "stacks":[{"name":"rnxjs-samples","vm":"oracle",
                      "path":"/var/www/playground.baryo.dev/rnxjs",
                      "releaseFile":"./baryovm.release.json"}]}
          JSON
          baryovm stack release rnxjs-samples --no-backup

      - name: Confirm both channels answer
        if: steps.gate.outputs.ready == 'true'
        run: BASE_URL=https://playground.baryo.dev/rnxjs npx playwright test --grep "names the build"

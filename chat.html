<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - rnxJS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="demo.css">
</head>

<body>

    <div class="topbar">
        <div class="shell topbar-in mono">
            <a class="wordmark" href="./" style="color:inherit;text-decoration:none">rnxJS</a>
            <span class="sep">/</span>
            <span>inbox</span>
            <span class="spacer"></span>
            <a class="chan" href="./"><i class="bi bi-arrow-left"></i>&nbsp;All demos</a>
        </div>
    </div>

    <div class="shell">

        <header class="page-head">
            <div class="titles">
                <h1>Ticket conversation</h1>
                <p class="sub">
                    A list that appends without re-rendering the whole thread, and an
                    input bound to reactive state.
                </p>
            </div>
        </header>

        <section class="grid-sidebar">
            <nav class="panel">
                <div class="panel-head"><h2>Threads</h2></div>
                <div class="side-nav" data-ref="threads"></div>
            </nav>

            <div class="panel chat-panel">
                <div class="panel-head">
                    <h2 data-ref="threadTitle"></h2>
                    <p class="hint" data-ref="threadMeta"></p>
                </div>
                <div class="thread" data-ref="thread"></div>
                <div class="composer">
                    <div data-ref="composer" style="flex:1"></div>
                    <div data-ref="send"></div>
                </div>
            </div>
        </section>

    </div>

    <footer style="margin-top:2.5rem">
        <div class="shell" style="display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center;">
            <span class="mono" data-ref="footVersion">rnxJS</span>
            <a href="./">All demos</a>
            <a href="https://github.com/BaryoDev/rnxJS_samples">Source</a>
            <span style="margin-left:auto" class="mono">MPL-2.0</span>
        </div>
    </footer>

    <script src="./rnx.global.js"></script>
    <script>
        const { Input, Button, createReactiveState } = rnx;
        const $ = (ref) => document.querySelector(`[data-ref="${ref}"]`);

        const THREADS = {
            'SUP-4182': {
                account: 'Northwind Freight', who: 'Priya Raman', unread: 2,
                messages: [
                    ['them', 'Priya Raman', 'Our renewal card was declined this morning but the card is fine, we used it elsewhere an hour ago.', '09:14'],
                    ['me', 'You', 'Thanks Priya. I can see two attempts at 08:52 and 08:58, both returned a soft decline from the issuer rather than from us.', '09:21'],
                    ['them', 'Priya Raman', 'So it is on the bank side?', '09:23'],
                    ['me', 'You', 'Most likely. I have paused the retry schedule so it will not lock the card. Can you ask them to allow a recurring charge from us?', '09:26'],
                    ['them', 'Priya Raman', 'Doing that now. How long do we have?', '09:31'],
                ],
            },
            'SUP-4179': {
                account: 'Halden Media', who: 'Tomas Vlk', unread: 0,
                messages: [
                    ['them', 'Tomas Vlk', 'SSO login loops back to the sign-in page on Safari only. Chrome is fine.', '08:02'],
                    ['me', 'You', 'That usually means the session cookie is being dropped. Is Prevent Cross-Site Tracking on?', '08:40'],
                    ['them', 'Tomas Vlk', 'It is, yes.', '08:44'],
                ],
            },
            'SUP-4171': {
                account: 'Cedarlane Health', who: 'Marta Nowak', unread: 0,
                messages: [
                    ['them', 'Marta Nowak', 'The CSV export is missing the last column since Friday.', 'Mon'],
                    ['me', 'You', 'Reproduced. It only affects exports with a filter applied. Fix is in the next release.', 'Mon'],
                ],
            },
        };

        const state = createReactiveState({ open: 'SUP-4182', draft: '' });

        const composer = Input({ placeholder: 'Write a reply' });
        const sendBtn = Button({ label: 'Send', icon: 'send', variant: 'primary' });
        $('composer').append(composer);
        $('send').append(sendBtn);

        const input = composer.querySelector('input') || composer;

        function renderThreads() {
            $('threads').innerHTML = Object.entries(THREADS).map(([ref, t]) => `
                <a href="#${ref}" data-ref-id="${ref}" aria-current="${state.open === ref}">
                    <span class="mono" style="font-size:0.75rem">${ref}</span>
                    <span style="display:block;font-size:0.82rem;color:var(--faint)">${t.account}</span>
                </a>`).join('');
        }

        function renderThread() {
            const t = THREADS[state.open];
            $('threadTitle').textContent = state.open;
            $('threadMeta').textContent = `${t.account} · ${t.who}`;
            $('thread').innerHTML = t.messages.map(([side, who, text, when]) => `
                <div class="msg ${side}">
                    <div class="bubble">${text}</div>
                    <div class="meta mono">${who} · ${when}</div>
                </div>`).join('');
            $('thread').scrollTop = $('thread').scrollHeight;
        }

        function send() {
            const text = input.value.trim();
            if (!text) return;
            const now = new Date();
            const when = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            THREADS[state.open].messages.push(['me', 'You', text, when]);
            input.value = '';
            state.draft = '';
            renderThread();
        }

        (sendBtn.querySelector('button') || sendBtn).addEventListener('click', send);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

        $('threads').addEventListener('click', (e) => {
            const a = e.target.closest('[data-ref-id]');
            if (!a) return;
            e.preventDefault();
            state.open = a.dataset.refId;
            renderThreads();
            renderThread();
        });

        renderThreads();
        renderThread();

        const build = (document.documentElement.dataset.rnxVersion || '').trim();
        if (build) $('footVersion').textContent = 'rnxJS ' + build;
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard - rnxJS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="demo.css">
</head>

<body>

    <div class="topbar">
        <div class="shell topbar-in mono">
            <a class="wordmark" href="./" style="color:inherit;text-decoration:none">rnxJS</a>
            <span class="sep">/</span>
            <span>admin dashboard</span>
            <span class="spacer"></span>
            <a class="chan" href="./"><i class="bi bi-arrow-left"></i>&nbsp;All demos</a>
        </div>
    </div>

    <div class="shell">

        <header class="page-head">
            <div class="titles">
                <h1>Support queue</h1>
                <p class="sub">
                    Everything on this page is an rnxJS component rendered from a plain
                    HTML template. No build step.
                </p>
            </div>
            <div class="page-actions" data-ref="actions"></div>
        </header>

        <section class="grid-metrics" data-ref="metrics"></section>

        <section class="grid-split" style="margin-top:0.85rem">
            <div class="panel">
                <div class="panel-head">
                    <h2>Open tickets</h2>
                    <p class="hint" data-ref="ticketHint"></p>
                </div>
                <div class="panel-body flush" data-ref="table"></div>
            </div>

            <div class="stack">
                <div class="panel">
                    <div class="panel-head"><h2>Recent activity</h2></div>
                    <div class="panel-body">
                        <ul class="feed" data-ref="feed"></ul>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-head"><h2>Actions</h2></div>
                    <div class="panel-body">
                        <div class="stack" style="gap:0.5rem" data-ref="quick"></div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <footer style="margin-top:2.5rem">
        <div class="shell" style="display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center;">
            <span class="mono" data-ref="footVersion">rnxJS</span>
            <a href="./">All demos</a>
            <a href="https://github.com/BaryoDev/rnxJS_samples">Source</a>
            <span style="margin-left:auto" class="mono">MPL-2.0</span>
        </div>
    </footer>

    <script src="./rnx.global.js"></script>
    <script>
        const { DataTable, Button, createReactiveState } = rnx;
        const $ = (ref) => document.querySelector(`[data-ref="${ref}"]`);
        const num = (v) => v.toLocaleString('en-US');

        // A support desk rather than "Alice Johnson / Bob Smith": a dashboard is
        // only legible if the data looks like something someone would actually
        // be looking at.
        const tickets = [
            { ref: 'SUP-4182', subject: 'Card declined on renewal', account: 'Northwind Freight', priority: 'High', age: '2h', owner: 'R. Okafor' },
            { ref: 'SUP-4179', subject: 'SSO login loops on Safari', account: 'Halden Media', priority: 'High', age: '4h', owner: 'M. Lindqvist' },
            { ref: 'SUP-4171', subject: 'Export missing last column', account: 'Cedarlane Health', priority: 'Normal', age: '1d', owner: 'R. Okafor' },
            { ref: 'SUP-4166', subject: 'Bulk import times out at 5k rows', account: 'Northwind Freight', priority: 'Normal', age: '1d', owner: 'A. Duarte' },
            { ref: 'SUP-4158', subject: 'Request: webhook retry policy', account: 'Pallas Analytics', priority: 'Low', age: '3d', owner: 'Unassigned' },
            { ref: 'SUP-4150', subject: 'Invoice PDF renders blank', account: 'Halden Media', priority: 'Normal', age: '3d', owner: 'A. Duarte' },
        ];

        const metrics = [
            { k: 'Open', v: 47, d: '6 unassigned' },
            { k: 'Breaching SLA', v: 3, d: 'within 2 hours', tone: 'down' },
            { k: 'Resolved today', v: 28, d: '+12% on yesterday', tone: 'up' },
            { k: 'Median first reply', v: '14m', d: 'target 30m', tone: 'up' },
        ];

        const activity = [
            ['SUP-4182 escalated to tier 2', '3m', true],
            ['A. Duarte replied on SUP-4150', '18m', true],
            ['SUP-4144 resolved by M. Lindqvist', '1h', false],
            ['Webhook retries re-enabled for Pallas', '2h', false],
            ['Nightly export completed, 12,480 rows', '5h', false],
        ];

        // ---- render -------------------------------------------------------

        $('metrics').innerHTML = metrics.map(m => `
            <div class="metric">
                <span class="k">${m.k}</span>
                <span class="v">${typeof m.v === 'number' ? num(m.v) : m.v}</span>
                <span class="d ${m.tone || ''}">${m.d}</span>
            </div>
        `).join('');

        $('feed').innerHTML = activity.map(([what, when, live]) => `
            <li>
                <span class="dot ${live ? 'on' : ''}"></span>
                <span class="what">${what}</span>
                <span class="when">${when}</span>
            </li>
        `).join('');

        $('ticketHint').textContent = `${tickets.length} of 47 shown`;

        // The table is a real rnxJS DataTable. Sort any column.
        $('table').appendChild(DataTable({
            columns: [
                { key: 'ref', label: 'Ref', sortable: true },
                { key: 'subject', label: 'Subject', sortable: true },
                { key: 'account', label: 'Account', sortable: true },
                { key: 'priority', label: 'Priority', sortable: true },
                { key: 'age', label: 'Age', sortable: true },
                { key: 'owner', label: 'Owner', sortable: true },
            ],
            rows: tickets,
            pageSize: 6,
            filterable: false,
            ariaLabel: 'Open support tickets',
        }));

        // rnxJS Buttons, because a plain <button> is currently replaced by one
        // anyway and loses its classes (BaryoDev/rnxjs#49).
        const act = (label, icon, variant) => {
            const b = Button({ label, icon, variant });
            b.style.width = '100%';
            return b;
        };
        $('quick').append(
            act('Assign next ticket', 'inbox', 'primary'),
            act('Export this view', 'download', 'outlined'),
            act('Notify on-call', 'bell', 'outlined'),
        );

        $('actions').append(
            Button({ label: 'New ticket', icon: 'plus-lg', variant: 'primary' }),
        );

        const build = (document.documentElement.dataset.rnxVersion || '').trim();
        if (build) $('footVersion').textContent = 'rnxJS ' + build;
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - rnxJS Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <Container class="py-4">
        <!-- Top App Bar -->
        <div class="glass p-3 mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h4 mb-0 fw-bold">
                    <i class="bi bi-speedometer2 text-primary"></i> Admin Dashboard
                </h1>
            </div>
            <div class="d-flex gap-2">
                <Button variant="outlined" onclick="window.location.href='index.html'">
                    <i class="bi bi-house-fill"></i> Home
                </Button>
                <Button variant="primary" onclick="refreshData()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </Button>
            </div>
        </div>

        <!-- Stats Cards -->
        <Row class="g-4 mb-4">
            <Column class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" data-bind="display.users"></div>
                    <div class="text-success small">
                        <i class="bi bi-arrow-up-short"></i> +12% from last month
                    </div>
                </div>
            </Column>
            <Column class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Revenue</div>
                    <div class="stat-value">$<span data-bind="display.revenue"></span></div>
                    <div class="text-success small">
                        <i class="bi bi-arrow-up-short"></i> +8% from last month
                    </div>
                </div>
            </Column>
            <Column class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Active Sessions</div>
                    <div class="stat-value" data-bind="display.sessions"></div>
                    <div class="text-warning small">
                        <i class="bi bi-dash"></i> No change
                    </div>
                </div>
            </Column>
            <Column class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Conversion Rate</div>
                    <div class="stat-value"><span data-bind="stats.conversion"></span>%</div>
                    <div class="text-success small">
                        <i class="bi bi-arrow-up-short"></i> +3.2% from last month
                    </div>
                </div>
            </Column>
        </Row>

        <!-- Recent Activity & Quick Actions -->
        <Row class="g-4 mb-4">
            <Column class="col-md-8">
                <Card class="glass h-100">
                    <div class="card-body">
                        <h2 class="h5 fw-bold mb-3">
                            Recent Activity
                        </h2>
                        <div id="activity-list"></div>
                    </div>
                </Card>
            </Column>
            <Column class="col-md-4">
                <Card class="glass h-100">
                    <div class="card-body">
                        <h2 class="h5 fw-bold mb-3">
                            Quick Actions
                        </h2>
                        <div class="d-grid gap-2">
                            <Button variant="primary" onclick="addUser()">
                                <i class="bi bi-person-plus-fill"></i> Add User
                            </Button>
                            <Button variant="outlined" onclick="generateReport()">
                                <i class="bi bi-file-earmark-bar-graph-fill"></i> Generate Report
                            </Button>
                            <Button variant="outlined" onclick="exportData()">
                                <i class="bi bi-download"></i> Export Data
                            </Button>
                            <Button variant="outlined" onclick="viewSettings()">
                                <i class="bi bi-gear-fill"></i> Settings
                            </Button>
                        </div>
                    </div>
                </Card>
            </Column>
        </Row>

        <!-- Users Table -->
        <Card class="glass">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 fw-bold mb-0">
                        User Management
                    </h2>
                    <div class="d-flex gap-2">
                        <Input placeholder="Search users..." data-bind="searchQuery" style="width: 250px;" />
                        <Button variant="outlined" onclick="state.searchQuery = ''">
                            <i class="bi bi-x-lg"></i>
                        </Button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table"></tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div class="text-muted small">
                        Showing <span data-bind="displayedCount"></span> of <span data-bind="totalCount"></span> users
                    </div>
                    <div id="pagination"></div>
                </div>
            </div>
        </Card>
    </Container>

    <!-- rnxJS Library -->
    <script src="./rnx.global.js"></script>

    <script>
        const { createReactiveState, autoRegisterComponents, loadComponents } = rnx;

        // Sample data
        const users = [
            { id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', status: 'Active' },
            { id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'User', status: 'Active' },
            { id: 3, name: 'Charlie Brown', email: 'charlie@example.com', role: 'Manager', status: 'Inactive' },
            { id: 4, name: 'Diana Prince', email: 'diana@example.com', role: 'User', status: 'Active' },
            { id: 5, name: 'Eve Wilson', email: 'eve@example.com', role: 'Admin', status: 'Active' },
            { id: 6, name: 'Frank Miller', email: 'frank@example.com', role: 'User', status: 'Active' },
            { id: 7, name: 'Grace Lee', email: 'grace@example.com', role: 'Manager', status: 'Active' },
            { id: 8, name: 'Henry Davis', email: 'henry@example.com', role: 'User', status: 'Inactive' },
        ];

        const activities = [
            { icon: 'person-plus-fill', text: 'New user registered: Alice Johnson', time: '2 minutes ago', color: 'success' },
            { icon: 'file-earmark-check-fill', text: 'Report generated successfully', time: '15 minutes ago', color: 'info' },
            { icon: 'shield-fill-check', text: 'Security update completed', time: '1 hour ago', color: 'primary' },
            { icon: 'exclamation-triangle-fill', text: 'Server maintenance scheduled', time: '2 hours ago', color: 'warning' },
            { icon: 'trash-fill', text: 'User account deleted', time: '3 hours ago', color: 'danger' },
        ];

        // Create reactive state
        const state = createReactiveState({
            stats: {
                users: 2847,
                revenue: 45230,
                sessions: 1253,
                conversion: 3.8
            },
            // What the cards display. Raw numbers stay above for the maths;
            // a dashboard that prints 45230 instead of 45,230 reads as unfinished.
            display: {
                users: '2,847',
                revenue: '45,230',
                sessions: '1,253'
            },
            searchQuery: '',
            users: users,
            activities: activities,
            displayedCount: 0,
            totalCount: users.length
        });

        // Register components
        autoRegisterComponents();
        loadComponents(document.body, state);

        // Render users table
        function renderUsersTable() {
            const query = state.searchQuery.toLowerCase();
            const filtered = state.users.filter(user =>
                user.name.toLowerCase().includes(query) ||
                user.email.toLowerCase().includes(query) ||
                user.role.toLowerCase().includes(query)
            );

            state.displayedCount = filtered.length;

            const tbody = document.getElementById('users-table');
            tbody.innerHTML = filtered.map(user => `
                <tr class="fade-in">
                    <td>${user.id}</td>
                    <td><strong>${user.name}</strong></td>
                    <td>${user.email}</td>
                    <td><span class="badge bg-secondary">${user.role}</span></td>
                    <td>
                        <span class="badge ${user.status === 'Active' ? 'bg-success' : 'bg-warning'}">
                            ${user.status}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editUser(${user.id})">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Render activity list
        function renderActivityList() {
            const container = document.getElementById('activity-list');
            container.innerHTML = state.activities.map(activity => `
                <div class="d-flex align-items-start gap-3 mb-3 fade-in">
                    <div class="feature-icon" style="width: 40px; height: 40px; font-size: 1rem; background: var(--gradient-${activity.color || 'primary'});">
                        <i class="bi bi-${activity.icon}"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="fw-medium">${activity.text}</div>
                        <small class="text-muted">${activity.time}</small>
                    </div>
                </div>
            `).join('');
        }

        // Subscribe to search changes
        state.subscribe('searchQuery', renderUsersTable);

        // Initial render
        renderUsersTable();
        renderActivityList();

        // Simulate real-time updates
        function refreshData() {
            state.stats.users += Math.floor(Math.random() * 10);
            state.stats.revenue += Math.floor(Math.random() * 1000);
            state.stats.sessions += Math.floor(Math.random() * 20) - 10;

            const n = (v) => v.toLocaleString('en-US');
            state.display.users = n(state.stats.users);
            state.display.revenue = n(state.stats.revenue);
            state.display.sessions = n(state.stats.sessions);
        }

        // Action handlers
        function editUser(id) {
            const user = state.users.find(u => u.id === id);
            alert(`Editing user: ${user.name}`);
        }

        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                state.users = state.users.filter(u => u.id !== id);
                state.totalCount = state.users.length;
                renderUsersTable();
            }
        }

        function addUser() {
            alert('Add User dialog would open here');
        }

        function generateReport() {
            alert('Generating report...');
        }

        function exportData() {
            alert('Exporting data...');
        }

        function viewSettings() {
            window.location.href = 'settings.html';
        }
    </script>
</body>

</html>
